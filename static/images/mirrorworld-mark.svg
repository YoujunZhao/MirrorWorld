<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MirrorWorld mark</title>
  <desc id="desc">A rounded glass mirror with a diagonal reflection</desc>
  <defs>
    <linearGradient id="body" x1="14" y1="7" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9d8e5"/>
      <stop offset=".2" stop-color="#575675"/>
      <stop offset=".52" stop-color="#312f4d"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <linearGradient id="edge" x1="15" y1="8" x2="49" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f3f8"/>
      <stop offset=".45" stop-color="#b9b7d1"/>
      <stop offset="1" stop-color="#74748f"/>
    </linearGradient>
    <linearGradient id="reflection" x1="22" y1="55" x2="43" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aea9d4" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#c8c4ec" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f4f3fb" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-45%" y="-35%" width="190%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <clipPath id="mirrorClip">
      <rect x="17" y="8" width="30" height="48" rx="9"/>
    </clipPath>
  </defs>
  <rect x="17" y="8" width="30" height="48" rx="9" fill="url(#body)" stroke="url(#edge)" stroke-width="1.25" filter="url(#shadow)"/>
  <path d="M22 55 42 9h5L27 55Z" fill="url(#reflection)" clip-path="url(#mirrorClip)"/>
  <path d="M22 55 42 9" fill="none" stroke="#f5f4fb" stroke-opacity=".86" stroke-width="1.9" stroke-linecap="round" clip-path="url(#mirrorClip)"/>
  <path d="M20 13c2-2 4-3 7-3" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
</svg>
